[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pick-path"
version = "0.1.0.dev0"
description = "Order picking routes for a warehouse with parallel aisles: S-shape, return, midpoint, largest gap, 2-opt and exact."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pick-path = "pick_path.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
